name: AWBridge
options:
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# The two targets are built separately and the watch app is copied into
# AWBridge.app/Watch by the CI workflow, so there is no target dependency here.
targets:
  Host:
    type: application
    platform: iOS
    sources:
      - Host
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: AW Bridge
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.awbridge.host
        PRODUCT_NAME: AWBridge
        TARGETED_DEVICE_FAMILY: "1"
  Watch:
    type: application
    platform: watchOS
    sources:
      - Watch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: AW Bridge
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.awbridge.host
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - physical-therapy
        # The watch's own GPS keeps the map going when the phone is gone,
        # also with the wrist down.
        UIBackgroundModes:
          - location
        NSBluetoothAlwaysUsageDescription: Kết nối với điện thoại Android để nhận chỉ đường và thông báo.
        NSLocationWhenInUseUsageDescription: Dùng GPS của watch cho bản đồ khi điện thoại mất kết nối hoặc hết pin.
        NSLocationAlwaysAndWhenInUseUsageDescription: Dùng GPS của watch cho bản đồ khi điện thoại mất kết nối hoặc hết pin, cả khi hạ tay.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.awbridge.host.watchkitapp
        PRODUCT_NAME: AWBridgeWatch
        TARGETED_DEVICE_FAMILY: "4"
